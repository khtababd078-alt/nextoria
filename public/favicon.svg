<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#681a15"/>

  <!-- Graduation cap base (diamond shape) -->
  <polygon points="32,12 56,24 32,36 8,24" fill="#bbcae1"/>

  <!-- Cap top shadow line -->
  <polygon points="32,12 56,24 32,36 8,24" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>

  <!-- Cap body / cylinder -->
  <path d="M20,27 L20,40 Q20,44 32,46 Q44,44 44,40 L44,27" fill="#8a2420"/>
  <ellipse cx="32" cy="46" rx="12" ry="3" fill="#6e1e1a"/>

  <!-- Tassel cord -->
  <line x1="56" y1="24" x2="56" y2="37" stroke="#bbcae1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="56" cy="39" r="3" fill="#bbcae1"/>
  <line x1="54" y1="41" x2="52" y2="48" stroke="#bbcae1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="42" x2="56" y2="50" stroke="#bbcae1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="41" x2="60" y2="48" stroke="#bbcae1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Letter N -->
  <text x="32" y="38" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">N</text>
</svg>
